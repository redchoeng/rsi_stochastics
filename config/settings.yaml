# 지표 파라미터 (engine/indicators.py의 기본값과 일치시켜 문서화 목적으로 유지)
indicators:
  stochastic:
    k_period: 14
    k_smooth: 3
    d_smooth: 3
  rsi:
    period: 14
    ma_period: 14
  failure_swing:
    oversold: 20
    overbought: 80

universe:
  top_n: 100
  liquidity_floor_n: 300    # 1단계: 거래대금 상위 이만큼으로 유동성 최소 기준만 거름
  lookback_days: 5          # 거래대금 계산에 쓰는 최근 거래일 수
  volatility_period: 14     # 2단계: ATR% 계산 기간 (이 안에서 변동성 상위 top_n개 재랭킹)
  refresh_weekday: 0        # 0=월요일. 이 요일에 실행될 때만 universe.json 재계산

market_hours:
  timezone: "America/New_York"
  # 프리마켓(04:00)~애프터마켓(20:00) 전체 포함. 정규장은 09:30~16:00.
  open: "04:00"
  close: "20:00"
  regular_open: "09:30"
  regular_close: "16:00"

daily_scan:
  history_period: "6mo"     # 일봉 워밍업(스토캐/RSI/failure swing lookback)에 충분한 기간
  min_conditions: 2         # 3개(스토캐 크로스/failure swing/RSI 크로스) 중 같은 날 몇 개 이상 겹쳐야 방향 확정할지

intraday_check:
  history_period: "5d"      # yfinance 15m 데이터 제공 한계(최근 60일) 내에서 워밍업에 충분한 기간
  min_volume_ratio: 0.1     # 트리거 봉 거래량이 그 종목 '정규장' 15분봉 중앙값의 이 비율 미만이면 노이즈로 보고 무시

exit_strategy:
  atr_period: 14            # 일봉 ATR 계산 기간
  atr_multiplier: 3.0       # 손절선 = 진입 이후 최고가 - (ATR * 이 배수), Chandelier Exit
