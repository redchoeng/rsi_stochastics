name: Daily Regime Scan

on:
  schedule:
    # 미국장 마감 직후 (KST 05:10 ≈ UTC 20:10), 월~금
    - cron: '10 20 * * 1-5'
  workflow_dispatch:

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily regime scan
        run: python run_daily_scan.py
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add config/universe.json config/daily_signals.json alerts/state.json
          if ! git diff --staged --quiet; then
            git commit -m "Daily regime scan - $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
